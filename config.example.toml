# ano の設定ファイルの例。OS 標準の設定ディレクトリの config.toml（macOS は
# ~/Library/Application Support/ano、Linux は $XDG_CONFIG_HOME/ano（既定 ~/.config/ano）、
# Windows は %APPDATA%\ano\config）に置きます。カレントディレクトリの config.toml があれば
# そちらを優先します。API キーなどの環境変数は、同じディレクトリの .env にも書けます
# （カレントディレクトリの .env とシェルの環境変数が優先）。

[api]
# 認証方式: "api_key"（既定）または "chatgpt"。
# ChatGPT を使う場合は先に `ano auth login` を実行してください。
# auth = "chatgpt"
# 認証情報の保存先。省略時は OS 標準のデータディレクトリの auth/chatgpt.json
# （macOS は ~/Library/Application Support/ano、Linux は ~/.local/share/ano、
# Windows は %APPDATA%\ano\data）。以前の ~/.ano/auth/chatgpt.json は初回に移します。
# chatgpt_auth_file = "~/secrets/ano-chatgpt.json"
# ChatGPT 接続では base_url の変更は不可。API キーは使用しません。
# OpenAI Responses API endpoint.
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# The API the endpoint speaks: "responses" (POST /responses, the default) or
# "chat_completions" (POST /chat/completions) for a server without the
# Responses API. Chat completions carry function tools only: MCP servers must
# be connected by ano (transport = "stdio" or "streamable_http").
# wire_api = "responses"
# Per-request timeout, and retries for connection failures and 429 / 5xx.
timeout_secs = 600
max_retries = 2
# Stream answers so they appear on the terminal while they are generated.
# Endpoints that ignore the request and return JSON still work.
stream = true
# Tokens the models take in one request; the history is compacted before it
# grows near this. LM Studio reports it by itself; providers take it too.
# context_window = 400000

# For a local or self-hosted server (LM Studio, Ollama, vLLM, llama.cpp),
# point base_url at it, e.g. "http://127.0.0.1:1234/v1" (LM Studio) or
# "http://127.0.0.1:11434/v1" (Ollama), and set agent.model to the loaded model.
# Only api.openai.com requires the key; for other endpoints, requests are sent
# without an Authorization header when the api_key_env variable is not set.

# Named providers besides [api] (named "api"); `ano provider add/set/remove`
# edits them without opening this file. [agent].provider picks the default;
# choose another with --provider NAME,
# `provider = "NAME"` in an environment, or /provider NAME in `ano chat`.
# timeout_secs, max_retries, and stream default to the [api] values;
# base_url, api_key_env, and wire_api do not (they default to OpenAI's).
# OPENAI_BASE_URL only overrides [api], never a named provider.
# [providers.lan]
# base_url = "http://192.168.1.10:1234/v1"
# Model to switch to with this provider; without it the current model is kept.
# model = "qwen/qwen3-coder-30b"
# Reviewer for approval_mode = "auto" on this provider; defaults to the model.
# approval_model = "qwen/qwen3-4b"
# Model names to offer for a provider that does not list its models (such as
# a ChatGPT subscription); `ano model add MODEL --provider NAME` adds them.
# models = ["gpt-5.6-luna"]
# Models of this provider that may be used: an allowlist and a denylist of
# exact names or prefixes ending in *. Edit them with `ano model enable`,
# `ano model disable`, or `ano model edit` (with --provider NAME).
# [api] takes them too.
# allowed_models = ["qwen/*"]
# disabled_models = ["qwen/qwen3-4b"]
# Providers to try in order while this one cannot be reached, times out, or
# is overloaded (408, 429, 5xx). The conversation is sent to them.
# fallback = ["codex"]
# enabled = false keeps the settings but refuses to use the provider.
# enabled = true
#
# [providers.codex]
# auth = "chatgpt"
# model = "gpt-5-codex"
#
# A server that offers only /v1/chat/completions.
# [providers.chat]
# base_url = "http://192.168.1.10:8080/v1"
# wire_api = "chat_completions"

# Presets: a provider, a model, and a reasoning effort switched together
# (`ano preset add/set/remove` edits them). Choose one with --preset NAME,
# `preset = "NAME"` in an environment, /preset NAME in `ano chat`, or as the
# default with the default role of [agent.roles]. `ano preset edit NAME` chooses
# them from lists. A preset applies over what lower layers chose:
# one with only reasoning_effort keeps the model. "default" is reserved for
# the settings of [agent].
# [presets.quick]
# provider = "lan"
# model = "qwen/qwen3-4b"
# reasoning_effort = "low"
# description = "Narrow investigation and file surveys"
#
# [presets.deep]
# provider = "codex"
# model = "gpt-5-codex"
# reasoning_effort = "high"

[agent]
# This default is suitable for text/image + tool use. For native audio input,
# choose an audio-capable Responses model (for example gpt-audio-1.5).
# Override with `ano run --model ...` when needed.
model = "gpt-6-astra"
# The provider runs use unless one is chosen (`ano provider use NAME`).
# Without it, runs connect through [api]; [agent].model is the model of [api]
# and of a default provider without its own model.
# provider = "lan"
# Total Responses requests; the final request is reserved for a tool-free report.
# A guard against runaway runs, not a budget: use max_total_tokens for cost.
max_tool_rounds = 100
tool_discovery_limit = 12
parallel_tool_calls = true
# Tool calls from one response that may run at the same time.
max_parallel_tool_calls = 8
# Timeout for one local tool or direct MCP tool call.
# Named workspace_check commands use their own timeout_secs instead.
tool_timeout_secs = 120
# Tool outputs longer than this (JSON bytes) are cut to their head and tail.
max_tool_output_bytes = 131072
# The history is compacted when a request nears the model's context window
# (context_window of [api] or the provider; LM Studio reports it), or when a
# request is refused as too long. Optionally, also at this many bytes of
# serialized history. Sessions archive the old history.
# compact_threshold_bytes = 262144
# "remote" uses /responses/compact (OpenAI); "summary" asks the model for a
# summary and works with any endpoint; "auto" picks by base_url.
# compaction = "auto"
# Soft per-run limit for reported input + output tokens, including compaction.
# Checked after API responses; a response can overshoot. Missing usage stops the run.
# max_total_tokens = 100000
# Reasoning models: effort (none, minimal, low, medium, high, xhigh, max,
# ultra; which ones work depends on the model) and a
# readable summary (auto, concise, detailed) shown as progress. Omit to use
# the model's defaults. Override the effort with `--reasoning-effort`.
# reasoning_effort = "medium"
# reasoning_summary = "auto"
# Files in the workspace root appended to the instructions of every run.
# Missing files are skipped; set [] to disable.
# project_instructions = ["AGENTS.md"]
# How approval requests (MCP calls and workspace_exec commands) are answered
# for runs without --environment, and the default of `ano web` sessions:
# "ask" (prompt on the terminal), "auto" (a reviewer model allows low-risk calls
# within the user's request and denies the rest without asking; the
# default), "allow", or "deny". Override with `--approval-mode`.
# approval_mode = "auto"
# Reviewer model for auto mode; defaults to model.
# approval_model = "a-fast-reviewer-model"
# Omit instructions to use the built-in plan -> inspect -> edit -> verify workflow.
# Setting this replaces the built-in instructions.
# instructions = "Your task-agent instructions..."

# Presets of the roles (`ano preset role ROLE NAME`). The default role is the
# main agent's for runs that choose none, applied over provider, model, and
# reasoning_effort above. Another role without one uses the main agent's
# current provider, model, and effort; with one, the preset applies over them,
# and "default" is the configured choice even after `ano chat` switched away.
# [agent.roles]
# default = "quick"     # the main agent
# delegate = "quick"    # sub-agents of delegate_task
# review = "deep"       # the reviewer of review_changes
# approval = "quick"    # the reviewer of approval_mode = "auto" (over approval_model)

[webhook]
bind = "127.0.0.1:8080"
path = "/webhook/tasks"
secret_env = "ANO_WEBHOOK_SECRET"
max_body_bytes = 1048576
# Honoured only when bound to a loopback address.
allow_unauthenticated = false
# Requests must carry X-Ano-Timestamp within this many seconds; a signature is
# accepted only once inside that window.
signature_tolerance_secs = 300
max_concurrent_jobs = 2
max_pending_jobs = 64
max_retained_jobs = 1000
# Wall-clock limit per running job, excluding time spent in the queue.
job_timeout_secs = 1800

[history]
# chronotope への原文履歴保存。既定は無効です。
enabled = false
base_url = "http://127.0.0.1:7878"
# 未送信イベントを再送するまで保持します。省略時は OS 標準のデータディレクトリの history
# （macOS は ~/Library/Application Support/ano/history、Linux は $XDG_DATA_HOME/ano/history
# （既定 ~/.local/share/ano/history）、Windows は %APPDATA%\ano\data\history）。
# 相対パスは設定ファイルのあるディレクトリが基準です。
# 以前の既定の保存先（設定ファイルの隣の .ano/history）が残っていれば、そちらを使い続けます。
# data_dir = "~/ano-history"
principal = "ano"
# token_env = "CHRONOTOPE_TOKEN"
timeout_secs = 5

[skills]
# 上手くいった手順をスキル（SKILL.md）として保存し、以後の実行で参照します。既定は無効です。
enabled = false
# 省略時は OS 標準のデータディレクトリ（macOS は ~/Library/Application Support/ano/skills、
# Linux は ~/.local/share/ano/skills、Windows は %APPDATA%\ano\data\skills）。
# ユーザーごとに <dir>/<user>/<name>/SKILL.md へ保存します。
# dir = "~/notes/ano-skills"

# Webhook callers and `ano run --environment NAME` select names declared here.
# Relative workspace paths and MCP cwd paths resolve from this config directory;
# a leading ~ expands to the home directory. Without a workspace, CLI runs use
# the current directory and webhook jobs have no workspace.
[environments.default]
# Provider, model, and effort of this environment (webhook jobs and
# --environment runs); provider, model, and reasoning_effort apply over preset.
# preset = "quick"
# provider = "lan"
# model = "qwen/qwen3-coder-30b"
allowed_tools = ["echo", "unix_time", "workspace_list", "workspace_read", "workspace_search", "workspace_find", "workspace_check", "history_*"]
allow_writes = false
# Environments default to "deny" because webhook jobs have nobody to ask.
# "auto" allows what the reviewer approves and denies the rest.
# approval_mode = "auto"

# Example writable coding environment. workspace_* also allows
# workspace_move and workspace_delete, which cannot be undone.
# [environments.coding]
# workspace = "/path/to/my-repository"
# allowed_tools = ["workspace_*"]
# allow_writes = true
# Let workspace_exec run shell commands. Commands are not sandboxed; each one
# is judged by approval_mode ("deny" by default in environments).
# allow_exec = true
# approval_mode = "auto"
# Explicit opt-in: configured checks execute with ano's OS permissions and
# may run project code. Register only commands for workspaces you trust.
# [environments.coding.checks.test]
# program = "cargo"
# args = ["test", "--locked"]
# description = "Run the project's tests"
# timeout_secs = 90
# [environments.coding.checks.format]
# program = "cargo"
# args = ["fmt", "--check"]
# description = "Check Rust formatting"
# timeout_secs = 30

# By default, remote MCP servers are executed by the Responses API. You may
# set transport = "responses" explicitly; this also supports tunnel_id.
# Use `require_approval = "never"` only for a server you trust and want to run
# in auto mode. An explicit allowed_tools list makes per-function blocking
# enforceable for this server.
# [[mcp_servers]]
# label = "deepwiki"
# url = "https://mcp.deepwiki.com/mcp"
# description = "Trusted documentation MCP server"
# allowed_tools = ["ask_question", "read_wiki_structure"]
# require_approval = "always"
# Optional metadata lets lazy discovery find MCP functions without loading the
# whole server tool list into every model request.
# [[mcp_servers.tool_catalog]]
# name = "ask_question"
# description = "Ask a question against the documentation corpus"

# You can embed an environment variable into a URL: `${VAR}` or `$VAR` is
# replaced with that variable's value when the config is loaded, so a single
# file can point at different hosts per machine or profile. A literal `$$`
# becomes one `$`, and a reference whose variable is missing (or empty) fails
# loudly instead of silently pointing at an empty endpoint.
#   export ANNICT_MCP_BASE="https://annict-mcp-server.example.com"
# [[mcp_servers]]
# label = "annict"
# transport = "streamable_http"
# url = "${ANNICT_MCP_BASE}/mcp"

# For a private MCP server connected through Secure MCP Tunnel, use tunnel_id
# instead of url.
# [[mcp_servers]]
# label = "private_tools"
# tunnel_id = "mcp_tunnel_id"
# authorization_env = "PRIVATE_MCP_TOKEN"
# require_approval = "never"

# Connect directly to an MCP server over Streamable HTTP from ano.
# [[mcp_servers]]
# label = "docs_http"
# transport = "streamable_http"
# url = "https://mcp.example.com/mcp"
# authorization_env = "DOCS_MCP_TOKEN"
# allowed_tools = ["search_docs", "read_page"]
# require_approval = "always"
# Tools the server offers can be listed with `ano mcp tools docs_http` and
# turned on or off with `ano mcp edit docs_http` (or `ano mcp enable/disable`),
# which rewrite allowed_tools, or disabled_tools when there is no allowlist.
# disabled_tools = ["delete_page"]

# GitHub's MCP server: read issues and pull requests, open pull requests, and
# comment. Local changes are committed and pushed with the git_commit_push
# tool (needs allow_writes), whose result create_pull_request takes.
# export GITHUB_MCP_TOKEN="$(gh auth token)"   # or a personal access token
# [[mcp_servers]]
# label = "github"
# transport = "streamable_http"
# url = "https://api.githubcopilot.com/mcp/"
# authorization_env = "GITHUB_MCP_TOKEN"
# Leave out merging, deleting, and creating repositories.
# allowed_tools = ["issue_read", "list_issues", "search_issues", "pull_request_read", "list_pull_requests", "search_pull_requests", "get_file_contents", "create_pull_request", "update_pull_request", "add_issue_comment", "pull_request_review_write", "add_comment_to_pending_review"]

# A Streamable HTTP server that requires OAuth. Run `ano mcp login docs_oauth`
# once; the tokens are refreshed automatically and saved in the OS data directory:
#   macOS:   ~/Library/Application Support/ano/oauth
#   Linux:   $XDG_DATA_HOME/ano/oauth (~/.local/share/ano/oauth)
#   Windows: %APPDATA%\ano\data\oauth
# Tokens saved by earlier versions under ~/.ano/oauth are moved there on first use.
# [[mcp_servers]]
# label = "docs_oauth"
# transport = "streamable_http"
# url = "https://mcp.example.com/mcp"
# oauth = true
# oauth_scopes = ["read"]    # optional; defaults to the scopes the server advertises

# Launch a local MCP server over stdio. env_vars maps the child-process
# variable name to the name of an environment variable available to ano.
# [[mcp_servers]]
# label = "local_files"
# transport = "stdio"
# command = "node"
# args = ["./server.js"]
# cwd = "./mcp-servers/files"
# env_vars = { FILES_API_TOKEN = "FILES_API_TOKEN" }
# allowed_tools = ["read_file", "list_files"]
# require_approval = "always"
# The connection (and process) is shared by every run. Set to false for a
# stateful server that must not share state between tasks.
# reuse_connection = true

[users.default]
# Local names are matched directly. MCP functions can be addressed as
# `mcp:server_label:tool_name`, `server_label:tool_name`, or `server_label:*`.
# A bare deny rule such as `delete_*` also blocks MCP tools on every server;
# allow rules must be server-qualified to match an MCP tool.
disabled_tools = ["shell_exec", "mcp:deepwiki:delete_issue"]
# allowed_tools = ["workspace_*", "mcp:deepwiki:read_*"]

[users.restricted]
disabled_tools = ["echo", "unix_time", "mcp:deepwiki:*"]
