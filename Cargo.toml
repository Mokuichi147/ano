[package]
name = "ano"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A Rust autonomous agent backed by the OpenAI Responses API"
license = "MIT"
repository = "https://github.com/mokuichi147/ano"
readme = "README.md"

[dependencies]
anyhow = "1.0"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["now"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hmac = "0.12"
hex = "0.4"
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.4", default-features = false, features = ["auth", "client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.13"
regex = "1"
rustyline = { version = "18.0.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
terminal_size = "0.4"
termimad = "0.35"
toml_edit = "0.22"
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
eventsource-stream = "0.2"
htmd = "0.5"
ignore = "0.4"
directories = "6"
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
